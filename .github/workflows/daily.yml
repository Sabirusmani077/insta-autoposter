name: Daily Instagram Reel

on:
  schedule:
    # Continuous morning schedule (from 6:30 AM to 9:30 AM IST)
    # Starts early so GitHub runner queue delays never push posts into the afternoon
    - cron: '0 1 * * *'   # 06:30 AM IST
    - cron: '25 1 * * *'  # 06:55 AM IST
    - cron: '50 1 * * *'  # 07:20 AM IST
    - cron: '15 2 * * *'  # 07:45 AM IST
    - cron: '40 2 * * *'  # 08:10 AM IST
    - cron: '05 3 * * *'  # 08:35 AM IST
    - cron: '30 3 * * *'  # 09:00 AM IST
    - cron: '00 4 * * *'  # 09:30 AM IST
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish Reel to Instagram? (true/false)"
        default: "true"

concurrency:
  group: daily-instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      DO_PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast check if already published today
        id: precheck
        run: |
          TODAY=$(date -u -d "+5 hours 30 minutes" +%Y-%m-%d || python3 -c "import datetime; print((datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=5, minutes=30)).date().isoformat())")
          echo "Target IST date: $TODAY"
          if grep -q "\"date\": \"$TODAY\"" history.json && grep -q "\"status\": \"published\"" history.json; then
            echo "Already published for today ($TODAY). Skipping pipeline."
            echo "ALREADY_DONE=true" >> $GITHUB_ENV
          else
            echo "Not yet published for today ($TODAY). Proceeding with post pipeline."
            echo "ALREADY_DONE=false" >> $GITHUB_ENV
          fi

      - name: Set up Python 3.12
        if: env.ALREADY_DONE != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies & Python packages
        if: env.ALREADY_DONE != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 fonts-freefont-ttf
          python -m pip install --upgrade pip
          pip install pillow requests imageio-ffmpeg

      - name: Run prepare (Candidate selection, Reel video render & verification)
        if: env.ALREADY_DONE != 'true'
        run: python main.py prepare

      - name: Commit generated Reel video and cover
        if: env.ALREADY_DONE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images videos
          git commit -m "chore(reel): generate daily reel and cover [skip ci]" || echo "No reel changes to commit"
          git pull --rebase origin main || true
          git push origin main || true

      - name: Publish Reel to Instagram
        if: env.ALREADY_DONE != 'true' && env.DO_PUBLISH == 'true'
        env:
            IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
            IG_USER_ID: ${{ secrets.IG_USER_ID }}
            GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py publish

      - name: Record history and update repository
        if: always() && env.ALREADY_DONE != 'true' && env.DO_PUBLISH == 'true'
        run: |
          git add history.json
          git commit -m "chore(history): record published reel [skip ci]" || echo "No history changes to commit"
          git pull --rebase origin main || true
          git push origin main || true
