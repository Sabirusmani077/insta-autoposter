name: Daily Instagram Reel

on:
  schedule:
    # High-reliability morning queue using non-congested offset minutes
    # Starts at 06:07 AM IST (00:37 UTC) to absorb GitHub runner queue delays
    - cron: '37 0 * * *'  # 06:07 AM IST
    - cron: '03 1 * * *'  # 06:33 AM IST
    - cron: '23 1 * * *'  # 06:53 AM IST
    - cron: '47 1 * * *'  # 07:17 AM IST
    - cron: '07 2 * * *'  # 07:37 AM IST
    - cron: '27 2 * * *'  # 07:57 AM IST
    - cron: '47 2 * * *'  # 08:17 AM IST
    - cron: '07 3 * * *'  # 08:37 AM IST
    - cron: '27 3 * * *'  # 08:57 AM IST
    - cron: '47 3 * * *'  # 09:17 AM IST
    - cron: '07 4 * * *'  # 09:37 AM IST
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish Reel to Instagram? (true/false)"
        default: "true"

concurrency:
  group: daily-instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      DO_PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast check if already published today
        id: precheck
        run: |
          python3 -c "
          import json, datetime, os
          today = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=5, minutes=30)).date().isoformat()
          print(f'Target IST date: {today}')
          hist = json.load(open('history.json', 'r', encoding='utf-8')) if os.path.exists('history.json') else []
          is_done = any(h.get('date') == today and h.get('status') == 'published' for h in hist)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'ALREADY_DONE={\"true\" if is_done else \"false\"}\n')
          print(f'ALREADY_DONE={is_done}')
          "

      - name: Set up Python 3.12
        if: env.ALREADY_DONE != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies & Python packages
        if: env.ALREADY_DONE != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 fonts-freefont-ttf
          python -m pip install --upgrade pip
          pip install pillow requests imageio-ffmpeg

      - name: Run prepare (Candidate selection, Reel video render & verification)
        if: env.ALREADY_DONE != 'true'
        run: python main.py prepare

      - name: Commit generated Reel video and cover
        if: env.ALREADY_DONE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images videos
          git commit -m "chore(reel): generate daily reel and cover [skip ci]" || echo "No reel changes to commit"
          git pull --rebase origin main || true
          git push origin main || true

      - name: Publish Reel to Instagram
        if: env.ALREADY_DONE != 'true' && env.DO_PUBLISH == 'true'
        env:
            IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
            IG_USER_ID: ${{ secrets.IG_USER_ID }}
            GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py publish

      - name: Record history and update repository
        if: always() && env.ALREADY_DONE != 'true' && env.DO_PUBLISH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "chore(history): record published reel [skip ci]" || echo "No history changes to commit"
          git pull --rebase origin main || true
          git push origin main || true
