name: Daily Instagram Post

on:
  schedule:
    # Primary: 02:25 UTC = 07:55 AM IST (off-peak minute to prevent GitHub Actions dropped crons)
    - cron: "25 2 * * *"
    # Fallback backup: 03:10 UTC = 08:40 AM IST (backup run if GitHub delayed the first run; duplicate-blocked automatically)
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish to Instagram? (true/false)"
        default: "false"

concurrency:
  group: daily-instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      DO_PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies & Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 fonts-freefont-ttf
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Run prepare (Candidate selection, image render & quality verification)
        run: python main.py prepare

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "chore(image): generate daily image [skip ci]" || echo "No image changes to commit"
          git pull --rebase origin main || true
          git push origin main || true

      - name: Publish to Instagram
        if: env.DO_PUBLISH == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py publish

      - name: Record history and update repository
        if: always() && env.DO_PUBLISH == 'true'
        run: |
          git add history.json
          git commit -m "chore(history): record published post [skip ci]" || echo "No history changes to commit"
          git pull --rebase origin main || true
          git push origin main || true
